<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de Entrevistas PrismaOS</title>
<link rel="icon" href="/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    color-scheme: dark;
    --fondo: #1C1C21; --barra: #141417; --tarjeta: #24242B; --borde: #33333B; --hover: #2C2C34;
    --texto: #F2F2F0; --texto2: #9CA0AA; --acento: #FFC704; --acento-t: #1C1C21;
    --gris: #6B6F7A; --azul: #5B8DEF; --morado: #A07CF0; --verde: #3FBF7F; --rojo: #F06A5B;
    --fuente: "Archivo", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--fondo); color: var(--texto); font-family: var(--fuente); margin: 0; }
  body { font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  .envoltura { max-width: 1320px; margin: 0 auto; padding-inline: 20px; padding-block: 0 60px; }
  header.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--barra); border-bottom: 1px solid var(--borde); }
  header .fila { max-width: 1320px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header img { width: 46px; }
  .marca { font-stretch: 75%; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; font-size: 16px; margin-right: auto; }
  .marca small { display: block; font-stretch: 100%; font-weight: 500; letter-spacing: .02em; text-transform: none; color: var(--texto2); font-size: 12px; }
  h2 { font-stretch: 78%; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: 15px; margin: 34px 0 12px; color: var(--texto); }
  button, .boton { font: inherit; font-weight: 700; border-radius: 9px; padding: 9px 14px; border: 1px solid var(--borde); background: transparent; color: var(--texto); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  button:hover, .boton:hover { background: var(--hover); }
  button:focus-visible, .boton:focus-visible, input:focus, select:focus, textarea:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
  button.primario { background: var(--acento); border-color: var(--acento); color: var(--acento-t); }
  button.primario:hover { background: #ffd33d; }
  button.mini { padding: 5px 9px; font-size: 12px; }
  button[disabled] { opacity: .55; cursor: wait; }
  input, select, textarea { background: var(--barra); color: var(--texto); border: 1px solid var(--borde); border-radius: 9px; padding: 9px 12px; font: inherit; }
  textarea { width: 100%; min-height: 80px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 22px; }
  .kpi { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 14px 16px; }
  .kpi b { display: block; font-size: 30px; font-stretch: 80%; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kpi span { color: var(--texto2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .kpi.destacado b { color: var(--acento); }
  .aviso { margin-top: 16px; border: 1px solid #5a4a1a; background: #2a2414; color: #f5dc8a; border-radius: 12px; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .aviso code { background: #1a1608; padding: 2px 6px; border-radius: 5px; }
  .compartir { display: grid; grid-template-columns: 180px 1fr; gap: 20px; background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 18px; }
  .compartir .qr { background: #fff; padding: 10px; border-radius: 10px; width: 180px; height: 180px; }
  .compartir .qr img, .compartir .qr canvas { width: 160px !important; height: 160px !important; }
  .linea { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--barra); border: 1px solid var(--borde); border-radius: 7px; padding: 6px 9px; word-break: break-all; }
  .etq { color: var(--texto2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; min-width: 120px; }
  .areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
  .area { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; }
  .area .cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .area .cab b { font-stretch: 85%; font-weight: 700; font-size: 15px; }
  .area .cab span { color: var(--texto2); font-variant-numeric: tabular-nums; font-size: 12px; }
  .barra-p { height: 6px; background: var(--borde); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .barra-p i { display: block; height: 100%; background: var(--acento); border-radius: 4px; transition: width .6s ease-out; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; border-radius: 999px; padding: 3px 9px 3px 7px; border: 1px solid var(--borde); background: var(--barra); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
  .chip:hover { border-color: var(--texto2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .e-sin_empezar { background: var(--gris); } .e-en_curso { background: var(--azul); } .e-preguntas_nuevas { background: var(--morado); } .e-completa { background: var(--verde); }
  .leyenda { display: flex; gap: 14px; flex-wrap: wrap; color: var(--texto2); font-size: 12px; margin-bottom: 10px; }
  .leyenda span { display: inline-flex; align-items: center; gap: 6px; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabla-wrap { overflow-x: auto; border: 1px solid var(--borde); border-radius: 12px; }
  table { width: 100%; border-collapse: collapse; min-width: 860px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--borde); vertical-align: middle; }
  th { color: var(--texto2); font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; background: var(--barra); position: sticky; top: 0; }
  tr:hover td { background: #202026; }
  td .nombre { font-weight: 600; cursor: pointer; }
  td .cargo { color: var(--texto2); font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; }
  .mini-barra { width: 90px; height: 5px; background: var(--borde); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 8px; }
  .mini-barra i { display: block; height: 100%; background: var(--acento); }
  .num { font-variant-numeric: tabular-nums; color: var(--texto2); font-size: 12px; }
  /* cajón */
  .velo { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
  .cajon { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100%); background: var(--fondo); border-left: 1px solid var(--borde); z-index: 21; overflow-y: auto; padding: 20px 22px 60px; }
  .cajon h3 { font-stretch: 80%; font-size: 24px; text-transform: uppercase; margin: 6px 0 2px; }
  .cajon .sub { color: var(--texto2); margin-bottom: 14px; }
  .bloque { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 14px; margin-top: 14px; }
  .bloque h4 { margin: 0 0 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--texto2); }
  .qa { border-left: 2px solid var(--borde); padding: 2px 0 2px 12px; margin: 10px 0; }
  .qa .p { color: var(--texto2); font-size: 13px; }
  .qa .r { white-space: pre-wrap; }
  .qa.seg { border-color: var(--morado); } .qa.ronda { border-color: var(--azul); }
  .res dt { color: var(--acento); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-top: 10px; }
  .res dd { margin: 4px 0 0; }
  .res ul { margin: 4px 0; padding-left: 18px; }
  .sug { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px dashed var(--borde); }
  .sug small { display: block; color: var(--texto2); }
  .envio { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .envio .bloque { margin-top: 0; }
  .cadena { background: var(--tarjeta); border: 1px solid var(--acento); border-radius: 14px; padding: 18px; }
  .cadena h3 { margin: 4px 0; font-stretch: 80%; text-transform: uppercase; font-size: 22px; }
  .ok { color: var(--verde); font-weight: 600; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--acento); color: var(--acento-t); font-weight: 700; padding: 10px 16px; border-radius: 10px; z-index: 40; }
  .gate { max-width: 380px; margin: 12vh auto; padding-inline: 16px; }
  .gate .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 14px; padding: 22px; display: grid; gap: 12px; }
  .error { color: var(--rojo); min-height: 1em; }
  .vacio { color: var(--texto2); font-style: italic; }
  @media (max-width: 640px) { .compartir { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="barra"><div class="fila">
  <img src="/logo.svg" alt="Prismaticoos">
  <div class="marca">PrismaOS · Entrevistas<small id="subtitulo">Tablero de avance por área y por persona</small></div>
  <button id="btnDoc" class="primario" hidden>Documento para mi chat</button>
  <button id="btnExportMd" hidden>Descargar todo (.md)</button>
  <button id="btnExportJson" hidden>Descargar JSON</button>
  <button id="btnNueva" hidden>+ Persona</button>
</div></header>
<main class="envoltura" id="app"></main>

<script>
Element.prototype.poner = function (...h) { this.replaceChildren(...h.flat(Infinity).filter(x => x != null && x !== false)); };
const ss = { get(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch (e) {} } };
let PIN = ss.get('prisma_pin') || '';
let DATOS = null, filtroArea = '', filtroEstado = '', filtroTexto = '', cajonAbierto = null;
const ESTADOS = { sin_empezar: 'Sin empezar', en_curso: 'En curso', preguntas_nuevas: 'Preguntas nuevas', completa: 'Completa' };
const $app = document.getElementById('app');

function el(tag, attrs = {}, ...hijos) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
  }
  for (const h of hijos.flat(Infinity)) if (h != null && h !== false) n.append(h.nodeType ? h : document.createTextNode(String(h)));
  return n;
}
async function api(ruta, datos) {
  const r = await fetch(ruta, { method: datos ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json', 'X-Pin': PIN }, body: datos ? JSON.stringify(datos) : undefined });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { PIN = ''; ss.set('prisma_pin', ''); gate('PIN incorrecto'); throw new Error('PIN'); }
  if (!r.ok) throw new Error(j.error || 'Error de conexión');
  return j;
}
function toast(m) { const t = el('div', { class: 'toast', role: 'status' }, m); document.body.append(t); setTimeout(() => t.remove(), 2200); }
async function copiar(texto, msg = 'Copiado') { try { await navigator.clipboard.writeText(texto); toast(msg); } catch (e) { prompt('Copia:', texto); } }
function base() { return (DATOS.red.tunel || DATOS.red.lan).replace(/\/$/, ''); }
function linkDe(p) { return base() + '/p/' + p.token; }
function minutosDe(p) { return Math.max(10, Math.round((p.base_total || 25) * 1.2)); }
function waDe(p) { return 'https://wa.me/' + (p.telefono || '') + '?text=' + encodeURIComponent(mensajeDe(p)); }
function mensajeReabrir(p) {
  const n = p.nombre.split(' ')[0].replace(/"/g, '');
  return `Hola ${n} 👋 Tenemos unas preguntas nuevas para ti en tu entrevista de PrismaOS. Ya te abrimos el acceso: entra con tu mismo link, conectado al Wi-Fi de la oficina.\n⚠️ Esta respuesta se registrará una única vez: al terminar, tu entrevista vuelve a quedar cerrada.\n\n👉 ${linkDe(p)}`;
}
function mensajeDe(p) {
  const n = p.nombre.split(' ')[0].replace(/"/g, '');
  return `Hola ${n} 👋\nEstamos documentando cómo trabaja cada área de Prismaticoos, contado por quienes lo hacen todos los días, para que PrismaOS refleje el trabajo real de cada quien y nos coordinemos mejor. Tu experiencia es clave.\n\n📝 Son ${p.base_total || ''} preguntas sobre tu trabajo (unos ${minutosDe(p)} min). No es examen: no hay respuestas buenas ni malas.\n🎙️ Puedes dictar con el micrófono del teclado.\n💾 Se guarda solo: puedes pausar y seguir después con el mismo link.\n📶 Ábrelo conectado al Wi-Fi de la oficina.\n🔒 El link es solo tuyo, no lo compartas.\n⚠️ Esta respuesta se registrará una única vez: al terminar, tu entrevista queda cerrada.\n\n👉 ${linkDe(p)}`;
}
function hace(iso) {
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return 'hace un momento'; if (s < 3600) return `hace ${Math.round(s / 60)} min`;
  if (s < 86400) return `hace ${Math.round(s / 3600)} h`; return `hace ${Math.round(s / 86400)} d`;
}

function gate(error = '') {
  ['btnDoc', 'btnExportMd', 'btnExportJson', 'btnNueva'].forEach(id => document.getElementById(id).hidden = true);
  const inp = el('input', { id: 'pin', type: 'password', inputmode: 'numeric', autocomplete: 'off', placeholder: 'PIN del tablero' });
  const entrar = async () => { PIN = inp.value.trim(); ss.set('prisma_pin', PIN); try { await cargar(); } catch (e) {} };
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
  $app.poner(el('div', { class: 'gate' }, el('div', { class: 'tarjeta' },
    el('b', {}, 'Tablero de entrevistas'), el('span', { style: 'color:var(--texto2)' }, 'El PIN está en datos/acceso.json dentro de la carpeta de la app.'),
    inp, el('div', { class: 'error' }, error), el('button', { class: 'primario', onclick: entrar }, 'Entrar'))));
  inp.focus();
}

async function cargar() {
  DATOS = await api('/api/admin/estado');
  ['btnDoc', 'btnExportMd', 'btnExportJson', 'btnNueva'].forEach(id => document.getElementById(id).hidden = false);
  pintar();
}

function pintar() {
  const P = DATOS.personas;
  const cuenta = e => P.filter(p => p.estado === e).length;
  const respuestas = P.reduce((a, p) => a + p.respuestas, 0);
  const rondas = P.reduce((a, p) => a + p.rondas_pendientes, 0);
  const avance = Math.round(P.reduce((a, p) => a + p.progreso, 0) / (P.length || 1));
  const ia = DATOS.ia;
  const secciones = [];

  const datosResp = P.filter(p => p.datos_admin);
  const datosOk = datosResp.filter(p => !p.datos_admin.faltan.length);
  secciones.push(el('div', { class: 'kpis' },
    kpi(`${avance}%`, 'Avance general', true), kpi(P.length, 'Personas'), kpi(cuenta('completa'), 'Completas'),
    kpi(cuenta('en_curso'), 'En curso'), kpi(cuenta('sin_empezar'), 'Sin empezar'), kpi(respuestas, 'Respuestas'), kpi(rondas, 'Preguntas nuevas sin contestar'), kpi(`${datosOk.length}/${P.length}`, 'Datos de nómina completos')));

  const aj = DATOS.ajustes || {};
  secciones.push(el('div', { class: 'aviso' },
    el('div', { style: 'flex:1 1 380px' },
      el('b', {}, aj.ia_repreguntas_en_vivo ? 'La IA repregunta en vivo (gasta tokens de tu cuenta). ' : 'Las entrevistas no gastan tokens. '),
      aj.ia_repreguntas_en_vivo ? 'Puedes apagarlo en config/ajustes.json.' : 'El equipo solo responde preguntas; la IA de tu cuenta solo se usa cuando tú aprietas "Generar preguntas de seguimiento" o "Generar resumen".',
      el('div', { class: 'num', style: 'margin-top:4px' }, 'IA: ', ia.ok === true ? 'conectada' : ia.ok === false ? 'sin conexión — ' + (ia.mensaje || '') + ' (en Terminal: claude auth login)' : 'se prueba cuando la uses')),
    el('button', { onclick: async (ev) => { ev.target.disabled = true; ev.target.textContent = 'Probando…'; try { DATOS.ia = await api('/api/admin/probar_ia', {}); } catch (e) {} pintar(); } }, 'Probar IA')));

  // compartir
  secciones.push(el('h2', {}, 'Compartir con el equipo'));
  if (aj.link_general) {
    const qr = el('div', { class: 'qr', id: 'qr', 'aria-label': 'Código QR del link del grupo' });
    const general = base() + '/';
    const minTot = Math.round(P.reduce((s, p) => s + p.base_total, 0) / (P.length || 1) * 1.2);
    const msgGrupo = `📋 *Entrevistas PrismaOS* — ¡necesitamos a todo el equipo!\n\nEstamos documentando cómo trabaja cada área de Prismaticoos, contado por quienes lo hacen todos los días, para que PrismaOS refleje el trabajo real de cada quien y nos coordinemos mejor. Tu experiencia es la base.\n\n👉 Entra aquí conectado al *Wi-Fi de la oficina*:\n${general}\n${aj.pedir_codigo ? 'Código del equipo: ' + DATOS.codigo_equipo + '\n' : ''}\n1️⃣ Escribe tu nombre y apellido y confirma que eres tú (queda ligado a tu celular).\n2️⃣ Contesta las preguntas de tu puesto (unos ${minTot} min). No es examen: no hay respuestas buenas ni malas.\n3️⃣ Puedes dictar con el micrófono del teclado.\n4️⃣ Se guarda solo: si pausas, vuelve a abrir el mismo link y sigues donde te quedaste.\n\n⚠️ Esta respuesta se registrará una única vez: al terminar, tu entrevista queda cerrada y nadie más puede usar tu nombre.\n\n¿Dudas? Dentro hay una sección de preguntas frecuentes. Gracias 🙌`;
    secciones.push(el('div', { class: 'compartir' }, qr, el('div', {},
      el('div', { class: 'linea' }, el('span', { class: 'etq' }, 'Link del grupo'), el('span', { class: 'mono' }, general), el('button', { class: 'mini', onclick: () => copiar(general) }, 'Copiar')),
      aj.pedir_codigo ? el('div', { class: 'linea' }, el('span', { class: 'etq' }, 'Código del equipo'), el('span', { class: 'mono' }, DATOS.codigo_equipo)) : null,
      el('p', { class: 'num' }, 'Un solo mensaje para el grupo de WhatsApp. Nadie ve la lista del equipo: cada quien escribe su nombre y apellido y confirma "Sí, soy yo"; su nombre queda ligado a su celular y nadie más puede usarlo (si alguien cambia de celular, ábrelo en la tabla y toca "Liberar nombre"). Funciona solo con el Wi-Fi de la oficina.'),
      el('div', { class: 'linea' },
        el('button', { class: 'primario', onclick: () => copiar(msgGrupo, 'Mensaje copiado: pégalo en el grupo') }, 'Copiar mensaje para el grupo'),
        el('a', { class: 'boton', href: 'https://wa.me/?text=' + encodeURIComponent(msgGrupo), target: '_blank', rel: 'noopener' }, 'Abrir en WhatsApp')),
      el('details', {}, el('summary', { class: 'num' }, 'Ver mensaje'), el('pre', { style: 'white-space:pre-wrap;font-family:inherit' }, msgGrupo)))));
    setTimeout(() => { try { new QRCode(qr, { text: general, width: 160, height: 160, colorDark: '#141417', colorLight: '#ffffff' }); } catch (e) {} }, 0);
  } else {
    secciones.push(el('div', { class: 'bloque' },
      el('p', { style: 'margin:0 0 6px' }, el('b', {}, 'Cada persona entra solo con su link personal'), ' y solo desde la red Wi-Fi de la oficina (', el('span', { class: 'mono' }, DATOS.red.lan), '). Así nadie puede contestar por otra persona.'),
      el('p', { class: 'num', style: 'margin:0' }, 'En la tabla de abajo usa "WhatsApp" o "Mensaje" para mandar a cada quien su link, o abre a la persona y que escanee su QR desde tu pantalla.')));
  }

  // envío rápido
  const sinEnviar = P.filter(p => !p.enviado && p.estado !== 'completa');
  const conTel = P.filter(p => p.telefono).length;
  secciones.push(el('h2', {}, 'Enviar rápido'));
  secciones.push(el('div', { class: 'envio' },
    el('div', { class: 'bloque' }, el('h4', {}, '1 · Envío en cadena por WhatsApp'),
      el('p', { class: 'num', style: 'margin-top:0' }, `Te muestra a una persona a la vez: tocas "Abrir WhatsApp", envías y pasas a la siguiente. Faltan ${sinEnviar.length} por enviar. ${conTel ? conTel + ' tienen teléfono (se abre su chat directo).' : 'Sin teléfonos: WhatsApp te pedirá elegir el contacto.'}`),
      el('div', { class: 'linea' }, el('button', { class: 'primario', onclick: () => cadena(false) }, `Empezar (${sinEnviar.length})`),
        el('button', { onclick: () => cadena(true) }, 'Recordar a quien no ha terminado'))),
    el('div', { class: 'bloque' }, el('h4', {}, '2 · Teléfonos (opcional, más rápido)'),
      el('p', { class: 'num', style: 'margin-top:0' }, 'Pega una lista "Nombre, teléfono" (una persona por línea, 10 dígitos). Así cada botón de WhatsApp abre directo el chat de esa persona.'),
      (() => { const t = el('textarea', { placeholder: 'Minerva García, 33 1234 5678\nÓscar Serrano, 3312345678' }); const r = el('div', { class: 'num' });
        return el('div', {}, t, el('div', { class: 'linea' }, el('button', { onclick: async () => {
          const res = await api('/api/admin/telefonos_lote', { texto: t.value });

  const c = el('aside', { class: 'cajon', role: 'dialog' }, el('h3', {}, 'Agregar persona'),
    el('div', { style: 'display:grid;gap:10px;margin-top:14px' }, f.nombre, f.cargo, f.area, f.equipo, el('label', {}, f.lider, ' Tiene gente a cargo'), err,
      el('div', { class: 'linea' }, el('button', { class: 'primario', onclick: async () => {
        try { const { id } = await api('/api/admin/persona_nueva', { nombre: f.nombre.value, cargo: f.cargo.value, area: f.area.value, equipo: f.equipo.value, lider: f.lider.checked });
          cerrarCajon(); await refrescar(); pintar(); abrir(id); } catch (e) { err.textContent = e.message; }
      } }, 'Agregar'), el('button', { onclick: () => cerrarCajon() }, 'Cancelar'))));
  document.body.append(el('div', { class: 'velo', onclick: () => cerrarCajon() }), c);
};

setInterval(refrescar, 20000);
if (PIN) cargar().catch(() => {}); else gate();
</script>
</body>
