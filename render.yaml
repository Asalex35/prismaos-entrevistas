# Blueprint de Render para PrismaOS · Entrevistas.
# Los datos (respuestas, links, PIN) viven en el disco persistente, NUNCA en el repositorio.
services:
  - type: web
    name: prismaos-entrevistas
    runtime: python
    plan: starter            # el disco persistente requiere un plan de pago
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: python servidor.py
    healthCheckPath: /salud
    numInstances: 1          # un solo proceso: los datos son archivos en un disco
    disk:
      name: datos
      mountPath: /var/data
      sizeGB: 1
    domains:
      - entrevistas.orkestalabs.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PRISMA_DATOS
        value: /var/data/datos
      - key: PRISMA_DETRAS_DE_PROXY
        value: "1"
      - key: PRISMA_URL_PUBLICA
        value: https://entrevistas.orkestalabs.com
      - key: PRISMA_AJUSTE_SOLO_RED_LOCAL   # en internet no hay "red de la oficina"
        value: "0"
      - key: PRISMA_AJUSTE_PEDIR_CODIGO     # quien entra por el link general escribe el código del equipo
        value: "1"
      - key: ANTHROPIC_API_KEY              # se captura a mano en el panel de Render (secreta)
        sync: false
